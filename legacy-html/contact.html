<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Us - HireFlow</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f3f4f6] leading-6 text-[#1f2937] ![font-family:Inter,sans-serif]">
    <header class="navbar sticky top-0 z-[100] bg-white shadow-sm">
      <div class="container nav-container mx-auto max-w-[1200px] px-5 flex h-[70px] items-center justify-between">
        <a href="index.html" class="logo text-[#0066CC] no-underline"><span class="logo-text text-2xl font-bold text-[#0066CC] [&_span]:text-[#00A651]">Hire<span>Flow</span></span></a>
        <div class="nav-actions flex items-center gap-[10px]"><a href="login.html" class="btn btn-outline inline-block cursor-pointer rounded-lg px-4 py-2 text-center font-medium transition duration-300 border border-[#0066CC] bg-transparent text-[#0066CC] hover:bg-[#0066CC] hover:text-white">Login</a></div>
      </div>
    </header>

    <div class="container ![margin-top:40px] mx-auto max-w-[1200px] px-5">
        <div class="dashboard-box ![max-width:600px] ![margin:0_auto] rounded-lg border border-[#e5e7eb] bg-white p-5">
            <h2 class="![margin-bottom:20px] ![text-align:center]">Contact Support</h2>
            <form>
                <div class="form-group mb-5 [&_label]:mb-2 [&_label]:block [&_label]:text-sm [&_label]:font-medium [&_input]:w-full [&_input]:rounded-lg [&_input]:border [&_input]:border-[#e5e7eb] [&_input]:p-3 [&_input]:outline-none [&_input]:font-[Inter,sans-serif] [&_select]:w-full [&_select]:rounded-lg [&_select]:border [&_select]:border-[#e5e7eb] [&_select]:p-3 [&_select]:outline-none [&_select]:font-[Inter,sans-serif] [&_input:focus]:border-[#0066CC]">
                    <label>Your Name</label>
                    <input type="text" placeholder="Enter your name">
                </div>
                <div class="form-group mb-5 [&_label]:mb-2 [&_label]:block [&_label]:text-sm [&_label]:font-medium [&_input]:w-full [&_input]:rounded-lg [&_input]:border [&_input]:border-[#e5e7eb] [&_input]:p-3 [&_input]:outline-none [&_input]:font-[Inter,sans-serif] [&_select]:w-full [&_select]:rounded-lg [&_select]:border [&_select]:border-[#e5e7eb] [&_select]:p-3 [&_select]:outline-none [&_select]:font-[Inter,sans-serif] [&_input:focus]:border-[#0066CC]">
                    <label>Email Address</label>
                    <input type="email" placeholder="Enter your email">
                </div>
                <div class="form-group mb-5 [&_label]:mb-2 [&_label]:block [&_label]:text-sm [&_label]:font-medium [&_input]:w-full [&_input]:rounded-lg [&_input]:border [&_input]:border-[#e5e7eb] [&_input]:p-3 [&_input]:outline-none [&_input]:font-[Inter,sans-serif] [&_select]:w-full [&_select]:rounded-lg [&_select]:border [&_select]:border-[#e5e7eb] [&_select]:p-3 [&_select]:outline-none [&_select]:font-[Inter,sans-serif] [&_input:focus]:border-[#0066CC]">
                    <label>Message</label>
                    <textarea rows="5" placeholder="How can we help you?" class="![width:100%] ![padding:12px] ![border:1px_solid_#e5e7eb] ![border-radius:8px] ![font-family:Inter,_sans-serif]"></textarea>
                </div>
                <button type="button" class="btn btn-primary btn-block inline-block cursor-pointer rounded-lg px-4 py-2 text-center font-medium transition duration-300 bg-[#0066CC] text-white hover:bg-[#0052a3] w-full p-3 text-base">Send Message</button>
            </form>
        </div>
    </div>


<script src="js/main.js"></script>
<script src="js/jobs.js"></script>

</body>
</html>
