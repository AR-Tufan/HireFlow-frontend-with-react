<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - HireFlow</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f3f4f6] leading-6 text-[#1f2937] ![font-family:Inter,sans-serif]">
    <header class="navbar sticky top-0 z-[100] bg-white shadow-sm">
      <div class="container nav-container mx-auto max-w-[1200px] px-5 flex h-[70px] items-center justify-between">
        <a href="index.html" class="logo text-[#0066CC] no-underline"><span class="logo-text text-2xl font-bold text-[#0066CC] [&_span]:text-[#00A651]">Hire<span>Flow</span></span></a>
        <div class="nav-actions flex items-center gap-[10px]">
          <span class="![font-weight:500]">Hi, Job Seeker</span>
          <a href="login.html" class="btn btn-outline inline-block cursor-pointer rounded-lg px-4 py-2 text-center font-medium transition duration-300 border border-[#0066CC] bg-transparent text-[#0066CC] hover:bg-[#0066CC] hover:text-white">Logout</a>
        </div>
      </div>
    </header>

    <div class="container mx-auto max-w-[1200px] px-5">
        <div class="dashboard-layout mt-[30px] grid min-h-[70vh] grid-cols-[250px_minmax(0,1fr)] gap-5">
            <aside class="sidebar h-fit rounded-lg border border-[#e5e7eb] bg-white py-5">
                <div class="sidebar-menu [&_a]:block [&_a]:border-l-[3px] [&_a]:border-l-transparent [&_a]:px-5 [&_a]:py-3 [&_a]:font-medium [&_a]:text-[#1f2937] [&_a:hover]:border-l-[#0066CC] [&_a:hover]:bg-[#f0f7ff] [&_a:hover]:text-[#0066CC] [&_a.active]:border-l-[#0066CC] [&_a.active]:bg-[#f0f7ff] [&_a.active]:text-[#0066CC]">
                    <a class="text-[#0066CC] no-underline" href="seeker-dashboard.html">Dashboard</a>
                    <a href="seeker-profile.html" class="active no-underline">My Profile</a>
                    <a class="text-[#0066CC] no-underline" href="seeker-resume.html">My Resume / CV</a>
                    <a class="text-[#0066CC] no-underline" href="seeker-applications.html">My Applications</a>
                    <a class="text-[#0066CC] no-underline" href="seeker-saved-jobs.html">Saved Jobs</a>
                </div>
            </aside>

            <main class="dashboard-content flex flex-col gap-5">
                <div class="dashboard-box rounded-lg border border-[#e5e7eb] bg-white p-5">
                    <h2 class="![margin-bottom:20px]">Update Profile</h2>
                    
                    <form>
                        <div class="![display:grid] ![grid-template-columns:1fr_1fr] ![gap:20px]">
                            <div class="form-group mb-5 [&_label]:mb-2 [&_label]:block [&_label]:text-sm [&_label]:font-medium [&_input]:w-full [&_input]:rounded-lg [&_input]:border [&_input]:border-[#e5e7eb] [&_input]:p-3 [&_input]:outline-none [&_input]:font-[Inter,sans-serif] [&_select]:w-full [&_select]:rounded-lg [&_select]:border [&_select]:border-[#e5e7eb] [&_select]:p-3 [&_select]:outline-none [&_select]:font-[Inter,sans-serif] [&_input:focus]:border-[#0066CC]">
                                <label>Full Name</label>
                                <input type="text" placeholder="Enter your full name" value="John Doe">
                            </div>
                            <div class="form-group mb-5 [&_label]:mb-2 [&_label]:block [&_label]:text-sm [&_label]:font-medium [&_input]:w-full [&_input]:rounded-lg [&_input]:border [&_input]:border-[#e5e7eb] [&_input]:p-3 [&_input]:outline-none [&_input]:font-[Inter,sans-serif] [&_select]:w-full [&_select]:rounded-lg [&_select]:border [&_select]:border-[#e5e7eb] [&_select]:p-3 [&_select]:outline-none [&_select]:font-[Inter,sans-serif] [&_input:focus]:border-[#0066CC]">
                                <label>Email Address</label>
                                <input type="email" placeholder="Enter email" value="johndoe@email.com">
                            </div>
                            <div class="form-group mb-5 [&_label]:mb-2 [&_label]:block [&_label]:text-sm [&_label]:font-medium [&_input]:w-full [&_input]:rounded-lg [&_input]:border [&_input]:border-[#e5e7eb] [&_input]:p-3 [&_input]:outline-none [&_input]:font-[Inter,sans-serif] [&_select]:w-full [&_select]:rounded-lg [&_select]:border [&_select]:border-[#e5e7eb] [&_select]:p-3 [&_select]:outline-none [&_select]:font-[Inter,sans-serif] [&_input:focus]:border-[#0066CC]">
                                <label>Phone Number</label>
                                <input type="text" placeholder="Enter phone" value="+880 1700-000000">
                            </div>
                            <div class="form-group mb-5 [&_label]:mb-2 [&_label]:block [&_label]:text-sm [&_label]:font-medium [&_input]:w-full [&_input]:rounded-lg [&_input]:border [&_input]:border-[#e5e7eb] [&_input]:p-3 [&_input]:outline-none [&_input]:font-[Inter,sans-serif] [&_select]:w-full [&_select]:rounded-lg [&_select]:border [&_select]:border-[#e5e7eb] [&_select]:p-3 [&_select]:outline-none [&_select]:font-[Inter,sans-serif] [&_input:focus]:border-[#0066CC]">
                                <label>Location</label>
                                <input type="text" placeholder="City, Country" value="Dhaka, Bangladesh">
                            </div>
                        </div>
                        
                        <div class="form-group mb-5 [&_label]:mb-2 [&_label]:block [&_label]:text-sm [&_label]:font-medium [&_input]:w-full [&_input]:rounded-lg [&_input]:border [&_input]:border-[#e5e7eb] [&_input]:p-3 [&_input]:outline-none [&_input]:font-[Inter,sans-serif] [&_select]:w-full [&_select]:rounded-lg [&_select]:border [&_select]:border-[#e5e7eb] [&_select]:p-3 [&_select]:outline-none [&_select]:font-[Inter,sans-serif] [&_input:focus]:border-[#0066CC]">
                            <label>Professional Summary</label>
                            <textarea rows="4" placeholder="Write a short summary..." class="![width:100%] ![padding:12px] ![border:1px_solid_#e5e7eb] ![border-radius:8px] ![font-family:Inter,_sans-serif]"></textarea>
                        </div>

                        <button type="button" class="btn btn-primary inline-block cursor-pointer rounded-lg px-4 py-2 text-center font-medium transition duration-300 bg-[#0066CC] text-white hover:bg-[#0052a3]">Save Changes</button>
                    </form>
                </div>
            </main>
        </div>
    </div>

    <script src="js/main.js"></script>
<script src="js/dashboard.js"></script>

</body>
</html>
