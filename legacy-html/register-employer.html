<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register as Employer - HireFlow</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f3f4f6] leading-6 text-[#1f2937] ![font-family:Inter,sans-serif]">
    <div class="auth-wrapper flex min-h-[80vh] items-center justify-center px-5 py-10">
        <div class="auth-card w-full max-w-[450px] rounded-lg border border-[#e5e7eb] bg-white p-10 shadow-sm [&_h2]:mb-[10px] [&_h2]:text-center">
            <h2>Employer Registration</h2>
            <form action="login.html">
                <div class="form-group mb-5 [&_label]:mb-2 [&_label]:block [&_label]:text-sm [&_label]:font-medium [&_input]:w-full [&_input]:rounded-lg [&_input]:border [&_input]:border-[#e5e7eb] [&_input]:p-3 [&_input]:outline-none [&_input]:font-[Inter,sans-serif] [&_select]:w-full [&_select]:rounded-lg [&_select]:border [&_select]:border-[#e5e7eb] [&_select]:p-3 [&_select]:outline-none [&_select]:font-[Inter,sans-serif] [&_input:focus]:border-[#0066CC]"><label>Company Name</label><input type="text" placeholder="Company Name" required></div>
                <div class="form-group mb-5 [&_label]:mb-2 [&_label]:block [&_label]:text-sm [&_label]:font-medium [&_input]:w-full [&_input]:rounded-lg [&_input]:border [&_input]:border-[#e5e7eb] [&_input]:p-3 [&_input]:outline-none [&_input]:font-[Inter,sans-serif] [&_select]:w-full [&_select]:rounded-lg [&_select]:border [&_select]:border-[#e5e7eb] [&_select]:p-3 [&_select]:outline-none [&_select]:font-[Inter,sans-serif] [&_input:focus]:border-[#0066CC]"><label>Work Email</label><input type="email" placeholder="Email" required></div>
                <div class="form-group mb-5 [&_label]:mb-2 [&_label]:block [&_label]:text-sm [&_label]:font-medium [&_input]:w-full [&_input]:rounded-lg [&_input]:border [&_input]:border-[#e5e7eb] [&_input]:p-3 [&_input]:outline-none [&_input]:font-[Inter,sans-serif] [&_select]:w-full [&_select]:rounded-lg [&_select]:border [&_select]:border-[#e5e7eb] [&_select]:p-3 [&_select]:outline-none [&_select]:font-[Inter,sans-serif] [&_input:focus]:border-[#0066CC]"><label>Password</label><input type="password" placeholder="Password" required></div>
                <div class="form-group mb-5 [&_label]:mb-2 [&_label]:block [&_label]:text-sm [&_label]:font-medium [&_input]:w-full [&_input]:rounded-lg [&_input]:border [&_input]:border-[#e5e7eb] [&_input]:p-3 [&_input]:outline-none [&_input]:font-[Inter,sans-serif] [&_select]:w-full [&_select]:rounded-lg [&_select]:border [&_select]:border-[#e5e7eb] [&_select]:p-3 [&_select]:outline-none [&_select]:font-[Inter,sans-serif] [&_input:focus]:border-[#0066CC]"><label>Confirm Password</label><input type="password" placeholder="Confirm Password" required></div>
                <button type="submit" class="btn btn-primary btn-block inline-block cursor-pointer rounded-lg px-4 py-2 text-center font-medium transition duration-300 bg-[#0066CC] text-white hover:bg-[#0052a3] w-full p-3 text-base">Register Company</button>
            </form>
        </div>
    </div>
<script src="js/validation.js"></script>
<script src="js/auth.js"></script>

</body>
</html>
