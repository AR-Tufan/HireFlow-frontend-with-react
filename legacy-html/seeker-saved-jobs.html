<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved Jobs - HireFlow</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f3f4f6] leading-6 text-[#1f2937] ![font-family:Inter,sans-serif]">
    <header class="navbar sticky top-0 z-[100] bg-white shadow-sm">
      <div class="container nav-container mx-auto max-w-[1200px] px-5 flex h-[70px] items-center justify-between">
        <a href="index.html" class="logo text-[#0066CC] no-underline"><span class="logo-text text-2xl font-bold text-[#0066CC] [&_span]:text-[#00A651]">Hire<span>Flow</span></span></a>
        <div class="nav-actions flex items-center gap-[10px]"><a href="login.html" class="btn btn-outline inline-block cursor-pointer rounded-lg px-4 py-2 text-center font-medium transition duration-300 border border-[#0066CC] bg-transparent text-[#0066CC] hover:bg-[#0066CC] hover:text-white">Logout</a></div>
      </div>
    </header>

    <div class="container mx-auto max-w-[1200px] px-5">
        <div class="dashboard-layout mt-[30px] grid min-h-[70vh] grid-cols-[250px_minmax(0,1fr)] gap-5">
            <aside class="sidebar h-fit rounded-lg border border-[#e5e7eb] bg-white py-5">
                <div class="sidebar-menu [&_a]:block [&_a]:border-l-[3px] [&_a]:border-l-transparent [&_a]:px-5 [&_a]:py-3 [&_a]:font-medium [&_a]:text-[#1f2937] [&_a:hover]:border-l-[#0066CC] [&_a:hover]:bg-[#f0f7ff] [&_a:hover]:text-[#0066CC] [&_a.active]:border-l-[#0066CC] [&_a.active]:bg-[#f0f7ff] [&_a.active]:text-[#0066CC]">
                    <a class="text-[#0066CC] no-underline" href="seeker-dashboard.html">Dashboard</a>
                    <a class="text-[#0066CC] no-underline" href="seeker-profile.html">My Profile</a>
                    <a class="text-[#0066CC] no-underline" href="seeker-resume.html">My Resume / CV</a>
                    <a class="text-[#0066CC] no-underline" href="seeker-applications.html">My Applications</a>
                    <a href="seeker-saved-jobs.html" class="active no-underline">Saved Jobs</a>
                </div>
            </aside>

            <main class="dashboard-content flex flex-col gap-5">
                <div class="dashboard-box rounded-lg border border-[#e5e7eb] bg-white p-5">
                    <h2 class="![margin-bottom:20px]">Saved Jobs</h2>
                    <div class="job-grid ![grid-template-columns:repeat(auto-fit,_minmax(300px,_1fr))] mb-[50px] grid grid-cols-[repeat(auto-fit,minmax(350px,1fr))] gap-5">
                        
                        <div class="job-card rounded-lg border border-[#e5e7eb] bg-white p-5 shadow-sm">
                            <div class="job-card-header mb-[15px] flex gap-[15px]">
                                <div class="company-logo flex h-[50px] w-[50px] shrink-0 items-center justify-center rounded-lg bg-[#f3f4f6] text-xl font-bold text-[#0066CC]">G</div>
                                <div>
                                    <h3 class="job-title mb-[5px] text-lg text-[#1f2937]">Frontend Developer</h3>
                                    <p class="company-name text-sm text-[#6b7280]">Google</p>
                                </div>
                            </div>
                            <div class="job-details mb-5 flex flex-wrap gap-[10px]">
                                <span class="job-tag rounded-[5px] bg-[#f3f4f6] px-[10px] py-[5px] text-xs">Dhaka, BD</span>
                                <span class="job-tag rounded-[5px] bg-[#f3f4f6] px-[10px] py-[5px] text-xs">Full Time</span>
                            </div>
                            <div class="job-card-footer flex items-center justify-between border-t border-[#e5e7eb] pt-[15px]">
                                <a href="job-details.html" class="btn btn-outline ![width:48%] inline-block cursor-pointer rounded-lg px-4 py-2 text-center font-medium transition duration-300 border border-[#0066CC] bg-transparent text-[#0066CC] hover:bg-[#0066CC] hover:text-white">View</a>
                                <button class="btn btn-primary ![width:48%] ![background:red] ![border-color:red] inline-block cursor-pointer rounded-lg px-4 py-2 text-center font-medium transition duration-300 bg-[#0066CC] text-white hover:bg-[#0052a3]">Remove</button>
                            </div>
                        </div>

                    </div>
                </div>
            </main>
        </div>
    </div>

<script src="js/main.js"></script>
<script src="js/dashboard.js"></script>

</body>
</html>
