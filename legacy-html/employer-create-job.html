<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post a Job - HireFlow</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f3f4f6] leading-6 text-[#1f2937] ![font-family:Inter,sans-serif]">
    <header class="navbar sticky top-0 z-[100] bg-white shadow-sm">
      <div class="container nav-container mx-auto max-w-[1200px] px-5 flex h-[70px] items-center justify-between">
        <a href="index.html" class="logo text-[#0066CC] no-underline"><span class="logo-text text-2xl font-bold text-[#0066CC] [&_span]:text-[#00A651]">Hire<span>Flow</span></span></a>
        <div class="nav-actions flex items-center gap-[10px]">
          <a href="login.html" class="btn btn-outline inline-block cursor-pointer rounded-lg px-4 py-2 text-center font-medium transition duration-300 border border-[#0066CC] bg-transparent text-[#0066CC] hover:bg-[#0066CC] hover:text-white">Logout</a>
        </div>
      </div>
    </header>

    <div class="container mx-auto max-w-[1200px] px-5">
        <div class="dashboard-layout mt-[30px] grid min-h-[70vh] grid-cols-[250px_minmax(0,1fr)] gap-5">
            <aside class="sidebar h-fit rounded-lg border border-[#e5e7eb] bg-white py-5">
                <div class="sidebar-menu [&_a]:block [&_a]:border-l-[3px] [&_a]:border-l-transparent [&_a]:px-5 [&_a]:py-3 [&_a]:font-medium [&_a]:text-[#1f2937] [&_a:hover]:border-l-[#0066CC] [&_a:hover]:bg-[#f0f7ff] [&_a:hover]:text-[#0066CC] [&_a.active]:border-l-[#0066CC] [&_a.active]:bg-[#f0f7ff] [&_a.active]:text-[#0066CC]">
                    <a class="text-[#0066CC] no-underline" href="employer-dashboard.html">Dashboard</a>
                    <a class="text-[#0066CC] no-underline" href="employer-jobs.html">My Jobs</a>
                    <a href="employer-create-job.html" class="active no-underline">Post a New Job</a>
                    <a class="text-[#0066CC] no-underline" href="employer-applicants.html">Applicants</a>
                    <a class="text-[#0066CC] no-underline" href="employer-ranking.html">Candidate Ranking</a>
                </div>
            </aside>

            <main class="dashboard-content flex flex-col gap-5">
                <div class="dashboard-box rounded-lg border border-[#e5e7eb] bg-white p-5">
                    <h2 class="![margin-bottom:20px]">Create a New Job Post</h2>
                    
                    <form action="employer-jobs.html">
                        <div class="form-group mb-5 [&_label]:mb-2 [&_label]:block [&_label]:text-sm [&_label]:font-medium [&_input]:w-full [&_input]:rounded-lg [&_input]:border [&_input]:border-[#e5e7eb] [&_input]:p-3 [&_input]:outline-none [&_input]:font-[Inter,sans-serif] [&_select]:w-full [&_select]:rounded-lg [&_select]:border [&_select]:border-[#e5e7eb] [&_select]:p-3 [&_select]:outline-none [&_select]:font-[Inter,sans-serif] [&_input:focus]:border-[#0066CC]">
                            <label>Job Title</label>
                            <input type="text" placeholder="e.g. Senior Frontend Developer" required>
                        </div>
                        
                        <div class="![display:grid] ![grid-template-columns:1fr_1fr] ![gap:20px]">
                            <div class="form-group mb-5 [&_label]:mb-2 [&_label]:block [&_label]:text-sm [&_label]:font-medium [&_input]:w-full [&_input]:rounded-lg [&_input]:border [&_input]:border-[#e5e7eb] [&_input]:p-3 [&_input]:outline-none [&_input]:font-[Inter,sans-serif] [&_select]:w-full [&_select]:rounded-lg [&_select]:border [&_select]:border-[#e5e7eb] [&_select]:p-3 [&_select]:outline-none [&_select]:font-[Inter,sans-serif] [&_input:focus]:border-[#0066CC]">
                                <label>Category</label>
                                <select>
                                    <option>IT & Software</option>
                                    <option>Marketing</option>
                                    <option>Engineering</option>
                                </select>
                            </div>
                            <div class="form-group mb-5 [&_label]:mb-2 [&_label]:block [&_label]:text-sm [&_label]:font-medium [&_input]:w-full [&_input]:rounded-lg [&_input]:border [&_input]:border-[#e5e7eb] [&_input]:p-3 [&_input]:outline-none [&_input]:font-[Inter,sans-serif] [&_select]:w-full [&_select]:rounded-lg [&_select]:border [&_select]:border-[#e5e7eb] [&_select]:p-3 [&_select]:outline-none [&_select]:font-[Inter,sans-serif] [&_input:focus]:border-[#0066CC]">
                                <label>Job Type</label>
                                <select>
                                    <option>Full Time</option>
                                    <option>Part Time</option>
                                    <option>Remote</option>
                                </select>
                            </div>
                            <div class="form-group mb-5 [&_label]:mb-2 [&_label]:block [&_label]:text-sm [&_label]:font-medium [&_input]:w-full [&_input]:rounded-lg [&_input]:border [&_input]:border-[#e5e7eb] [&_input]:p-3 [&_input]:outline-none [&_input]:font-[Inter,sans-serif] [&_select]:w-full [&_select]:rounded-lg [&_select]:border [&_select]:border-[#e5e7eb] [&_select]:p-3 [&_select]:outline-none [&_select]:font-[Inter,sans-serif] [&_input:focus]:border-[#0066CC]">
                                <label>Location</label>
                                <input type="text" placeholder="e.g. Dhaka, Bangladesh">
                            </div>
                            <div class="form-group mb-5 [&_label]:mb-2 [&_label]:block [&_label]:text-sm [&_label]:font-medium [&_input]:w-full [&_input]:rounded-lg [&_input]:border [&_input]:border-[#e5e7eb] [&_input]:p-3 [&_input]:outline-none [&_input]:font-[Inter,sans-serif] [&_select]:w-full [&_select]:rounded-lg [&_select]:border [&_select]:border-[#e5e7eb] [&_select]:p-3 [&_select]:outline-none [&_select]:font-[Inter,sans-serif] [&_input:focus]:border-[#0066CC]">
                                <label>Salary Range (Optional)</label>
                                <input type="text" placeholder="e.g. ৳ 50,000 - 80,000">
                            </div>
                        </div>

                        <div class="form-group mb-5 [&_label]:mb-2 [&_label]:block [&_label]:text-sm [&_label]:font-medium [&_input]:w-full [&_input]:rounded-lg [&_input]:border [&_input]:border-[#e5e7eb] [&_input]:p-3 [&_input]:outline-none [&_input]:font-[Inter,sans-serif] [&_select]:w-full [&_select]:rounded-lg [&_select]:border [&_select]:border-[#e5e7eb] [&_select]:p-3 [&_select]:outline-none [&_select]:font-[Inter,sans-serif] [&_input:focus]:border-[#0066CC]">
                            <label>Required Skills (Comma separated)</label>
                            <input type="text" placeholder="e.g. React.js, Node.js, MongoDB">
                        </div>

                        <div class="form-group mb-5 [&_label]:mb-2 [&_label]:block [&_label]:text-sm [&_label]:font-medium [&_input]:w-full [&_input]:rounded-lg [&_input]:border [&_input]:border-[#e5e7eb] [&_input]:p-3 [&_input]:outline-none [&_input]:font-[Inter,sans-serif] [&_select]:w-full [&_select]:rounded-lg [&_select]:border [&_select]:border-[#e5e7eb] [&_select]:p-3 [&_select]:outline-none [&_select]:font-[Inter,sans-serif] [&_input:focus]:border-[#0066CC]">
                            <label>Job Description & Requirements</label>
                            <textarea rows="6" placeholder="Write job details here..." class="![width:100%] ![padding:12px] ![border:1px_solid_#e5e7eb] ![border-radius:8px] ![font-family:Inter,_sans-serif]"></textarea>
                        </div>

                        <div class="form-group mb-5 [&_label]:mb-2 [&_label]:block [&_label]:text-sm [&_label]:font-medium [&_input]:w-full [&_input]:rounded-lg [&_input]:border [&_input]:border-[#e5e7eb] [&_input]:p-3 [&_input]:outline-none [&_input]:font-[Inter,sans-serif] [&_select]:w-full [&_select]:rounded-lg [&_select]:border [&_select]:border-[#e5e7eb] [&_select]:p-3 [&_select]:outline-none [&_select]:font-[Inter,sans-serif] [&_input:focus]:border-[#0066CC]">
                            <label>Application Deadline</label>
                            <input type="date">
                        </div>

                        <button type="submit" class="btn btn-primary ![padding:12px_30px] inline-block cursor-pointer rounded-lg px-4 py-2 text-center font-medium transition duration-300 bg-[#0066CC] text-white hover:bg-[#0052a3]">Publish Job</button>
                        <a href="employer-jobs.html" class="btn btn-outline ![padding:12px_30px] inline-block cursor-pointer rounded-lg px-4 py-2 text-center font-medium transition duration-300 border border-[#0066CC] bg-transparent text-[#0066CC] hover:bg-[#0066CC] hover:text-white">Cancel</a>
                    </form>
                </div>
            </main>
        </div>
    </div>

<script src="js/main.js"></script>
<script src="js/dashboard.js"></script>

</body>
</html>
