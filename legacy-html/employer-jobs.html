<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Jobs - HireFlow</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f3f4f6] leading-6 text-[#1f2937] ![font-family:Inter,sans-serif]">
    <header class="navbar sticky top-0 z-[100] bg-white shadow-sm">
      <div class="container nav-container mx-auto max-w-[1200px] px-5 flex h-[70px] items-center justify-between">
        <a href="index.html" class="logo text-[#0066CC] no-underline"><span class="logo-text text-2xl font-bold text-[#0066CC] [&_span]:text-[#00A651]">Hire<span>Flow</span></span></a>
        <div class="nav-actions flex items-center gap-[10px]">
          <span class="![font-weight:500]">Hi, Employer</span>
          <a href="login.html" class="btn btn-outline inline-block cursor-pointer rounded-lg px-4 py-2 text-center font-medium transition duration-300 border border-[#0066CC] bg-transparent text-[#0066CC] hover:bg-[#0066CC] hover:text-white">Logout</a>
        </div>
      </div>
    </header>

    <div class="container mx-auto max-w-[1200px] px-5">
        <div class="dashboard-layout mt-[30px] grid min-h-[70vh] grid-cols-[250px_minmax(0,1fr)] gap-5">
            <!-- Employer Sidebar -->
            <aside class="sidebar h-fit rounded-lg border border-[#e5e7eb] bg-white py-5">
                <div class="sidebar-menu [&_a]:block [&_a]:border-l-[3px] [&_a]:border-l-transparent [&_a]:px-5 [&_a]:py-3 [&_a]:font-medium [&_a]:text-[#1f2937] [&_a:hover]:border-l-[#0066CC] [&_a:hover]:bg-[#f0f7ff] [&_a:hover]:text-[#0066CC] [&_a.active]:border-l-[#0066CC] [&_a.active]:bg-[#f0f7ff] [&_a.active]:text-[#0066CC]">
                    <a class="text-[#0066CC] no-underline" href="employer-dashboard.html">Dashboard</a>
                    <a href="employer-jobs.html" class="active no-underline">My Jobs</a>
                    <a class="text-[#0066CC] no-underline" href="employer-create-job.html">Post a New Job</a>
                    <a class="text-[#0066CC] no-underline" href="employer-applicants.html">Applicants</a>
                    <a class="text-[#0066CC] no-underline" href="employer-ranking.html">Candidate Ranking</a>
                </div>
            </aside>

            <!-- Main Content -->
            <main class="dashboard-content flex flex-col gap-5">
                <div class="dashboard-box ![display:flex] ![justify-content:space-between] ![align-items:center] ![margin-bottom:20px] rounded-lg border border-[#e5e7eb] bg-white p-5">
                    <h2>My Posted Jobs</h2>
                    <a href="employer-create-job.html" class="btn btn-primary inline-block cursor-pointer rounded-lg px-4 py-2 text-center font-medium transition duration-300 bg-[#0066CC] text-white hover:bg-[#0052a3]">+ Post New Job</a>
                </div>

                <div class="dashboard-box rounded-lg border border-[#e5e7eb] bg-white p-5">
                    <table class="![width:100%] ![text-align:left] ![border-collapse:collapse] w-full border-collapse text-left">
                        <thead>
                            <tr class="![border-bottom:2px_solid_#e5e7eb]">
                                <th class="![padding:10px_0] border-b-2 border-[#e5e7eb] py-[10px]">Job Title</th>
                                <th class="border-b-2 border-[#e5e7eb] py-[10px]">Posted Date</th>
                                <th class="border-b-2 border-[#e5e7eb] py-[10px]">Applicants</th>
                                <th class="border-b-2 border-[#e5e7eb] py-[10px]">Status</th>
                                <th class="border-b-2 border-[#e5e7eb] py-[10px]">Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr class="![border-bottom:1px_solid_#e5e7eb]">
                                <td class="![padding:15px_0] ![font-weight:500] border-b border-[#e5e7eb] py-[15px]">Senior React Developer</td>
                                <td class="![font-size:14px] ![color:#6b7280] border-b border-[#e5e7eb] py-[15px]">12 Oct 2026</td>
                                <td class="border-b border-[#e5e7eb] py-[15px]">15</td>
                                <td class="border-b border-[#e5e7eb] py-[15px]"><span class="![background:#dcfce7] ![color:#166534] ![padding:4px_8px] ![border-radius:4px] ![font-size:12px]">Active</span></td>
                                <td class="border-b border-[#e5e7eb] py-[15px]">
                                    <a href="employer-applicants.html" class="btn btn-outline ![padding:5px_10px] ![font-size:12px] inline-block cursor-pointer rounded-lg px-4 py-2 text-center font-medium transition duration-300 border border-[#0066CC] bg-transparent text-[#0066CC] hover:bg-[#0066CC] hover:text-white">View Applicants</a>
                                </td>
                            </tr>
                            <tr class="![border-bottom:1px_solid_#e5e7eb]">
                                <td class="![padding:15px_0] ![font-weight:500] border-b border-[#e5e7eb] py-[15px]">UI/UX Designer</td>
                                <td class="![font-size:14px] ![color:#6b7280] border-b border-[#e5e7eb] py-[15px]">05 Oct 2026</td>
                                <td class="border-b border-[#e5e7eb] py-[15px]">30</td>
                                <td class="border-b border-[#e5e7eb] py-[15px]"><span class="![background:#fee2e2] ![color:#991b1b] ![padding:4px_8px] ![border-radius:4px] ![font-size:12px]">Closed</span></td>
                                <td class="border-b border-[#e5e7eb] py-[15px]">
                                    <a href="employer-applicants.html" class="btn btn-outline ![padding:5px_10px] ![font-size:12px] inline-block cursor-pointer rounded-lg px-4 py-2 text-center font-medium transition duration-300 border border-[#0066CC] bg-transparent text-[#0066CC] hover:bg-[#0066CC] hover:text-white">View Applicants</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>

<script src="js/main.js"></script>
<script src="js/dashboard.js"></script>

</body>
</html>
