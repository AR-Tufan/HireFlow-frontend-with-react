<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seeker Dashboard - HireFlow</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f3f4f6] leading-6 text-[#1f2937] ![font-family:Inter,sans-serif]">
    <header class="navbar sticky top-0 z-[100] bg-white shadow-sm">
      <div class="container nav-container mx-auto max-w-[1200px] px-5 flex h-[70px] items-center justify-between">
        <a href="index.html" class="logo text-[#0066CC] no-underline"><span class="logo-text text-2xl font-bold text-[#0066CC] [&_span]:text-[#00A651]">Hire<span>Flow</span></span></a>
        <div class="nav-actions flex items-center gap-[10px]">
          <span class="![font-weight:500]">Hi, Job Seeker</span>
          <a href="login.html" class="btn btn-outline inline-block cursor-pointer rounded-lg px-4 py-2 text-center font-medium transition duration-300 border border-[#0066CC] bg-transparent text-[#0066CC] hover:bg-[#0066CC] hover:text-white">Logout</a>
        </div>
      </div>
    </header>

    <div class="container mx-auto max-w-[1200px] px-5">
        <div class="dashboard-layout mt-[30px] grid min-h-[70vh] grid-cols-[250px_minmax(0,1fr)] gap-5">
            <!-- Sidebar -->
            <aside class="sidebar h-fit rounded-lg border border-[#e5e7eb] bg-white py-5">
                <div class="sidebar-menu [&_a]:block [&_a]:border-l-[3px] [&_a]:border-l-transparent [&_a]:px-5 [&_a]:py-3 [&_a]:font-medium [&_a]:text-[#1f2937] [&_a:hover]:border-l-[#0066CC] [&_a:hover]:bg-[#f0f7ff] [&_a:hover]:text-[#0066CC] [&_a.active]:border-l-[#0066CC] [&_a.active]:bg-[#f0f7ff] [&_a.active]:text-[#0066CC]">
                    <a href="seeker-dashboard.html" class="active no-underline">Dashboard</a>
                    <a class="text-[#0066CC] no-underline" href="seeker-profile.html">My Profile</a>
                    <a class="text-[#0066CC] no-underline" href="seeker-resume.html">My Resume / CV</a>
                    <a class="text-[#0066CC] no-underline" href="seeker-applications.html">My Applications</a>
                    <a class="text-[#0066CC] no-underline" href="seeker-saved-jobs.html">Saved Jobs</a>
                </div>
            </aside>

            <!-- Main Content -->
            <main class="dashboard-content flex flex-col gap-5">
                <h2>Dashboard Overview</h2>
                
                <!-- Stats -->
                <div class="stat-grid grid grid-cols-[repeat(auto-fit,minmax(200px,1fr))] gap-[15px]">
                    <div class="stat-card border border-[#e5e7eb] border-l-4 border-l-[#0066CC] rounded-lg bg-white p-5 [&_h4]:mb-[5px] [&_h4]:text-sm [&_h4]:text-[#6b7280] [&_h2]:text-[28px] [&_h2]:text-[#1f2937]">
                        <h4>Total Applications</h4>
                        <h2>12</h2>
                    </div>
                    <div class="stat-card ![border-left-color:#00A651] border border-[#e5e7eb] border-l-4 border-l-[#0066CC] rounded-lg bg-white p-5 [&_h4]:mb-[5px] [&_h4]:text-sm [&_h4]:text-[#6b7280] [&_h2]:text-[28px] [&_h2]:text-[#1f2937]">
                        <h4>Shortlisted</h4>
                        <h2>3</h2>
                    </div>
                    <div class="stat-card ![border-left-color:#f59e0b] border border-[#e5e7eb] border-l-4 border-l-[#0066CC] rounded-lg bg-white p-5 [&_h4]:mb-[5px] [&_h4]:text-sm [&_h4]:text-[#6b7280] [&_h2]:text-[28px] [&_h2]:text-[#1f2937]">
                        <h4>Interviews</h4>
                        <h2>1</h2>
                    </div>
                </div>

                <!-- Recent Applications -->
                <div class="dashboard-box rounded-lg border border-[#e5e7eb] bg-white p-5">
                    <h3 class="![margin-bottom:15px]">Recent Applications</h3>
                    <table class="![width:100%] ![text-align:left] ![border-collapse:collapse] w-full border-collapse text-left">
                        <tr class="![border-bottom:1px_solid_#e5e7eb]">
                            <th class="![padding:10px_0] border-b-2 border-[#e5e7eb] py-[10px]">Job Title</th>
                            <th class="border-b-2 border-[#e5e7eb] py-[10px]">Company</th>
                            <th class="border-b-2 border-[#e5e7eb] py-[10px]">Status</th>
                        </tr>
                        <tr>
                            <td class="![padding:10px_0] border-b border-[#e5e7eb] py-[15px]">Frontend Developer</td>
                            <td class="border-b border-[#e5e7eb] py-[15px]">Google</td>
                            <td class="border-b border-[#e5e7eb] py-[15px]"><span class="![background:#dcfce7] ![color:#166534] ![padding:3px_8px] ![border-radius:4px] ![font-size:12px]">Shortlisted</span></td>
                        </tr>
                        <tr>
                            <td class="![padding:10px_0] border-b border-[#e5e7eb] py-[15px]">React Developer</td>
                            <td class="border-b border-[#e5e7eb] py-[15px]">Brain Station 23</td>
                            <td class="border-b border-[#e5e7eb] py-[15px]"><span class="![background:#f3f4f6] ![color:#374151] ![padding:3px_8px] ![border-radius:4px] ![font-size:12px]">Pending</span></td>
                        </tr>
                    </table>
                </div>
            </main>
        </div>
    </div>

<script src="js/main.js"></script>
<script src="js/dashboard.js"></script>

</body>
</html>
